<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f2027;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#203a43;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2c5364;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent Gradient (Neon Cyan to Blue) -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00f2fe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4facfe;stop-opacity:1" />
    </linearGradient>

    <!-- Glow Filter for Neon Effect -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base canvas with rounded corners -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)" />

  <g transform="translate(256, 276)">
    <!-- Radar / Sonar Rings -->
    <circle cx="0" cy="0" r="160" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-dasharray="10 15" opacity="0.3" />
    <circle cx="0" cy="0" r="110" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.5" />
    <circle cx="0" cy="0" r="60" fill="none" stroke="url(#accentGrad)" stroke-width="4" opacity="0.8" />

    <!-- Central Node (Scanner/Router) -->
    <circle cx="0" cy="0" r="25" fill="url(#accentGrad)" filter="url(#neonGlow)" />
    <circle cx="0" cy="0" r="10" fill="#ffffff" />

    <!-- Connected Device 1 (IoT) -->
    <g transform="translate(-100, -80)">
      <circle cx="0" cy="0" r="16" fill="#ffffff" />
      <circle cx="0" cy="0" r="6" fill="#0f2027" />
    </g>
    <!-- Connection Line 1 -->
    <line x1="-30" y1="-24" x2="-80" y2="-64" stroke="#ffffff" stroke-width="4" opacity="0.7" stroke-dasharray="5 5" />

    <!-- Connected Device 2 (Mobile/Wifi) -->
    <g transform="translate(110, -50)">
      <circle cx="0" cy="0" r="16" fill="#ffffff" />
      <path d="M -6 -4 L 6 -4 L 6 8 L -6 8 Z" fill="#0f2027" />
    </g>
    <!-- Connection Line 2 -->
    <line x1="32" y1="-14.5" x2="90" y2="-41" stroke="#ffffff" stroke-width="4" opacity="0.7" stroke-dasharray="5 5" />

    <!-- Connected Device 3 (Modem/PC) -->
    <g transform="translate(-40, 110)">
      <rect x="-12" y="-12" width="24" height="24" rx="4" fill="#ffffff" />
      <circle cx="0" cy="0" r="5" fill="#0f2027" />
    </g>
    <!-- Connection Line 3 -->
    <line x1="-12" y1="33" x2="-28" y2="90" stroke="#ffffff" stroke-width="4" opacity="0.7" stroke-dasharray="5 5" />
  </g>

  <!-- Wi-Fi Waves emanating from the center, shifted up -->
  <g transform="translate(256, 250)" fill="none" stroke="url(#accentGrad)" stroke-linecap="round" stroke-width="12" filter="url(#neonGlow)">
    <path d="M -50 -70 Q 0 -110 50 -70" />
    <path d="M -80 -100 Q 0 -160 80 -100" />
    <path d="M -110 -130 Q 0 -210 110 -130" />
  </g>
</svg>
